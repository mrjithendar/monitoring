# Kubeconfig template for ServiceAccount grafana-dashboards/github-dashboards-deployer (created by k8s-deployments,
# minikube-infrastructure/grafana.tf), which may only manage ConfigMaps in namespace grafana-dashboards.
# workflows/deploy.yml fills it in:
#   ${MK4_API_SERVER}         repository variable           cluster API URL
#   ${MK4_CA_DATA}            repository variable           base64 CA certificate of the cluster
#   ${MK4_DASHBOARDS_TOKEN}   environment secret (mk4)      token from Secret github-dashboards-deployer-token
# scripts/setup-ci-access.sh sets them (and renders this file locally to test it). Never commit a filled-in copy.
apiVersion: v1
kind: Config
clusters:
- name: mk4
  cluster:
    server: ${MK4_API_SERVER}
    certificate-authority-data: ${MK4_CA_DATA}
users:
- name: github-dashboards-deployer
  user:
    token: ${MK4_DASHBOARDS_TOKEN}
contexts:
- name: mk4
  context:
    cluster: mk4
    user: github-dashboards-deployer
    namespace: grafana-dashboards
current-context: mk4
